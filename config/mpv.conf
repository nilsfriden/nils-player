# mpv.conf - review setup v1.7
# Comments must be on their own line (mpv does not support trailing comments).

# --- Opening behaviour ---
# Open files paused on the first frame
pause=yes
# Stay on the last frame instead of closing at end of file
keep-open=yes
# Show a window even with no file, so you can drag and drop
force-window=immediate
idle=yes
autofit-larger=90%x90%
save-position-on-quit=no
title=${filename} - Nils-Player

# --- Clean picture: nothing is drawn on the video ---
# Built-in on-screen controller off (review-ui.lua draws its own bars outside the picture)
osc=no
# No OSD messages, seek bar or playback text on the picture
osd-level=0
osd-bar=no
osd-on-seek=no
osd-playing-msg=
# Subtitles off by default
sid=no
# Area around the picture is plain black
background-color=0/0/0

# --- Canon RAW (.CRM) ---
# Include .CRM when a folder is dropped; review-ui.lua plays the matching file in Proxy\
video-exts-append=crm
# Folders dropped on the player are scanned including subfolders
directory-mode=recursive

# --- Frame accuracy ---
hr-seek=yes
hr-seek-framedrop=no

# --- Cache (helps back-stepping and reverse playback) ---
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=512MiB

# --- Decoding ---
# ProRes and HAP decode on the CPU via FFmpeg; this only affects H.264/HEVC etc.
hwdec=auto-safe

# --- Font for mpv's own stats overlay (i / I) ---
osd-font=Consolas
osd-font-size=28
