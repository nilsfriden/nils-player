# input.conf - review keys v1.7
# Keys not listed here keep mpv's defaults
# (e.g. i = stats for a few seconds, I = toggle stats, s = screenshot, f = fullscreen).

# --- JKL shuttle ---
# L: play forward, press again for 2x / 4x / 8x
l script-binding jkl/forward
# J: play backward, press again for 2x / 4x / 8x
j script-binding jkl/reverse
# K: stop
k script-binding jkl/stop
SPACE script-binding jkl/toggle

# --- Frame stepping (hold to repeat) ---
RIGHT script-binding jkl/step-forward
LEFT  script-binding jkl/step-back

# --- Bigger jumps ---
Shift+RIGHT no-osd seek 1 relative+exact
Shift+LEFT  no-osd seek -1 relative+exact
UP          no-osd seek 10 relative+exact
DOWN        no-osd seek -10 relative+exact
HOME        no-osd seek 0 absolute+exact
END         no-osd seek 100 absolute-percent+exact

# --- Info ---
# T: switch timecode between the file's own (SRC) and elapsed from start (REL); clicking the timecode does the same
T script-binding review_ui/tc-mode
t script-binding review_ui/tc-mode
# M: full MediaInfo report in a side panel (wheel/Up/Down/PgUp/PgDn scroll, M or Esc closes)
M script-binding review_ui/mediainfo
